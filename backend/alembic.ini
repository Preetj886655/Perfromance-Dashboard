# Alembic configuration for Patil Manufacturing Analytics (backend)
# sqlalchemy.url is overridden in alembic/env.py from app.core.config.settings.database_url

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Leave blank — env.py sets sqlalchemy.url from app.core.config.settings.database_url
# (never put a second URL here; a wrong ini URL historically caused silent wrong-DB confusion)
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
