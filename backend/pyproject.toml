[project]
name = "pril-manufacturing-analytics-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "python-multipart==0.0.20",
  "pydantic==2.11.3",
  "pydantic-settings==2.9.1",
  "sqlalchemy==2.0.40",
  "alembic==1.15.2",
  "psycopg[binary]==3.2.13",
  "httpx==0.28.1",
  "openpyxl==3.1.5",
  "tzdata==2025.2",
  "PyJWT==2.10.1",
  "bcrypt==4.1.2",
  "google-api-python-client==2.174.0",
  "google-auth==2.40.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
